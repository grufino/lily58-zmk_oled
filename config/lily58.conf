# Enable encoder support (both sides)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED fully disabled on both sides to save battery (no display driver is built,
# so the SSD1306 stays in its power-on "display off" state)
CONFIG_ZMK_DISPLAY=n

# Deep sleep after 15 min idle; wakes on keypress
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Disable ZMK Studio so runtime keymap edits can't silently override the compiled keymap
CONFIG_ZMK_STUDIO=n

# We don't use RGB underglow on this build — shield's default leaves WS2812 SPI init half-configured
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Mouse emulation — encoder rotation sends scroll-wheel events
CONFIG_ZMK_POINTING=y
